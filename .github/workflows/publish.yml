name: Publish market calendar
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh public market calendar"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: market-calendar-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Stage public site
        run: |
          mkdir -p _site/data
          cp index.html crypto.html sectors.html indices.html style.css cross.js depth.js _site/
          cp -r calendar-assets _site/
          cp data/calendar.js _site/data/
          sed -i -E "s@data/calendar\.js(\?[^\"]*)?@data/calendar.js?v=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@g" _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
