<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暗号資産市場</title><link rel="stylesheet" href="style.css"><script src="depth.js?v=2" defer></script></head>
<body>
<main class="shell">
  <p><a href="./">市場カレンダーに戻る</a></p>
  <section class="panel">
    <h1>暗号資産市場</h1>
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <div class="tradingview-widget-copyright"><a href="https://www.tradingview.com/markets/cryptocurrencies/prices-all/" rel="noopener nofollow" target="_blank">暗号資産市場</a> by TradingView</div>
      <script src="https://s3.tradingview.com/external-embedding/embed-widget-screener.js" async>
      {"defaultColumn":"overview","screener_type":"crypto_mkt","displayCurrency":"USD","colorTheme":"light","isTransparent":false,"locale":"ja","width":"100%","height":550}
      </script>
    </div>
  </section>
  <section class="panel">
    <h2>暗号資産の板情報</h2>
    <p>BTC/USDTの板の厚みをヒートマップで表示します（Binance無期限先物）。</p>
    <iframe src="https://www.basischarts.com/embed/chart?symbol=BTCUSDT&amp;view=heatmap"
      width="100%" height="520" style="border:0" loading="lazy"
      sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
      title="BTC/USDTの板ヒートマップ"></iframe>
    <p><a href="https://www.basischarts.com/widgets/order-flow">板ヒートマップ by Basis</a></p>
  </section>
  <section class="panel">
    <h2>板の数量表（CSV）</h2>
    <p>1銘柄の板データを <code>side,price,size</code> の順で読み込みます。sideは買いが <code>bid</code>、売りが <code>ask</code> です。ファイルはブラウザ内だけで処理します。</p>
    <label>板データ <input id="depth-file" type="file" accept=".csv,text/csv"></label>
    <button id="depth-example" type="button">サンプルを表示</button>
    <p id="depth-status" role="status"></p>
    <table id="depth-table" hidden><thead><tr><th scope="col">売買区分</th><th scope="col">価格</th><th scope="col">数量</th></tr></thead><tbody></tbody></table>
  </section>
</main>
</body>
</html>
