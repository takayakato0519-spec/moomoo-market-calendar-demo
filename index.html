<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Calendar Demo</title><link rel="stylesheet" href="style.css"><script src="data/calendar.js" defer></script><script src="app.js" defer></script></head>
<body>
<header><div class="shell brand"><strong>MARKET CALENDAR</strong><span>MOOMOOAI / PUBLIC DEMO</span></div></header>
<main class="shell">
  <section class="intro"><div><p class="eyebrow">MARKET OVERVIEW</p><h1>市場カレンダー</h1><p>米国の主要な経済指標とNYSEの休場を日付ごとに確認。</p></div><span class="badge" id="updated"></span></section>
  <div class="layout">
    <section class="panel" aria-labelledby="month">
      <div class="panel-head"><h2 id="month"></h2><div class="controls"><button id="prev" aria-label="前月">‹</button><button id="reset">収録月</button><button id="next" aria-label="翌月">›</button></div></div>
      <label class="filter">表示 <select id="category"><option value="all">すべて</option><option>経済指標</option><option>休場</option><option id="earnings-option" disabled>決算</option></select></label>
      <div class="weekdays" aria-hidden="true"><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span></div>
      <div id="calendar" class="calendar"></div>
    </section>
    <section class="panel events" aria-labelledby="selected"><p class="eyebrow">DAILY AGENDA</p><h2 id="selected"></h2><div id="events" aria-live="polite"></div></section>
  </div>
<section class="panel heatmap" aria-labelledby="analyst-heading">
  <h2 id="analyst-heading">決算予定・アナリスト予想</h2>
  <p class="note" id="licensed-status">公開表示ライセンスのあるデータ接続が未設定です。</p>
  <div id="analysts"></div>
</section>
<p class="note source">収録範囲 <span id="coverage"></span>。指標は日本時間、休場・決算予定は市場の現地日付で表示します。<a href="https://fred.stlouisfed.org/releases/calendar">FRED</a> · <a href="https://www.nyse.com/trade/hours-calendars">NYSE</a></p>
</main>
</body></html>
