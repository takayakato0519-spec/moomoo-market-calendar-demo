<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Market Calendar Demo</title><link rel="stylesheet" href="style.css"><script src="data/calendar.js?v=official-comparison-1" defer></script><link rel="stylesheet" href="calendar-assets/calendar.css?v=official-comparison-1"><script src="calendar-assets/calendar.js?v=official-comparison-1" defer></script><script src="cross.js" defer></script></head>
<body>
<header><div class="shell brand"><strong>MARKET CALENDAR</strong><span>MOOMOOAI / PUBLIC DEMO</span></div></header>
<main class="shell">
  <section class="intro"><div><p class="eyebrow">MARKET OVERVIEW</p><h1>市場カレンダー</h1><p>米国の主要な経済指標とNYSEの休場を日付ごとに確認。</p></div></section>
  <section class="panel" aria-labelledby="calendar-title">
    <h2 id="calendar-title">市場環境</h2>
    <div id="market-calendar"></div>
  </section>
<section class="panel heatmap">
  <h2>銘柄の移動平均線</h2>
  <p>日足CSV（date,close または symbol,date,close）から、50日・200日単純移動平均の交差を確認します。ファイルはブラウザ内だけで処理します。</p>
  <form id="cross-form">
    <label>銘柄 <input id="cross-symbol" placeholder="例: WMT" required></label>
    <label>日足CSV <input id="cross-file" type="file" accept=".csv,text/csv" required></label>
    <button>計算</button>
  </form>
  <p id="cross-result" role="status"></p>
</section>
</main>
</body></html>
